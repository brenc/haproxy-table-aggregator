# Example: proxy "b" of a two-proxy cluster whose request rates
# htad aggregates (examples/two-node/htad.json). Stock HAProxy, no patch
# or module; nothing calls htad per request. TestExampleConfigs
# (internal/lab) checks this file with `haproxy -c` on the pinned builds
# and that its enforcement rules are the ones the lab enforces with in the
# live phase 10 tests. The limit is 100 requests per 10 s period.
global
    # Must match the "server" line without an address below; otherwise
    # HAProxy drops the whole peers section (with only a warning).
    localpeer b

defaults
    mode http
    timeout connect 2s
    timeout client 10s
    timeout server 10s

# Shared only with the aggregator, never with the other proxy: raw inputs
# are not replicated between proxies, so each proxy's contribution stays
# separate.
peers agg
    bind 127.0.0.1:10002
    server b
    server agg 127.0.0.1:10000

# Raw input: this proxy's own requests per key, the only table a request
# rule tracks. The aggregator reads it and never writes it.
backend req_in
    stick-table type ipv6 size 1m expire 30s store http_req_cnt,http_req_rate(10s) peers agg

# Aggregate output (output schema version 2): written only by the
# aggregator, never tracked; slot 1 is the cluster-wide rate in requests
# per 10 s, slot 2 the writing session's generation.
backend req_agg
    stick-table type ipv6 size 1m expire 30s store gpt(4) peers agg

# Metadata: the lease marker under ::, slot 1 its deadline (Unix ms mod
# 2^32) and slot 2 its generation. Its expire must be at most 2 s.
backend req_meta
    stick-table type ipv6 size 16 expire 2s store gpt(4) peers agg

frontend fe
    bind 127.0.0.1:8082
    # One key expression for tracking and every lookup: IPv4 /32, IPv6 /64.
    http-request set-var(txn.agg_key) src,ipmask(32,64)
    http-request track-sc0 var(txn.agg_key) table req_in
    http-request set-var(txn.agg_lrate) sc_http_req_rate(0)
    # Aggregate authority (frozen phase 06 rule): the lease marker exists,
    # its deadline is in the future and at most 2 s ahead, and the key's
    # aggregate entry carries the marker's generation. A missing key,
    # missing or revoked marker, or another session's entry is local.
    http-request set-var(txn.agg_now) date(0,ms),and(4294967295)
    http-request set-var(txn.agg_left) ipv6(::),table_gpt(1,req_meta),sub(txn.agg_now),and(4294967295)
    http-request set-var(txn.agg_gen) ipv6(::),table_gpt(2,req_meta)
    acl agg_meta  ipv6(::),table_gpt(0,req_meta) eq 2
    acl agg_lease var(txn.agg_left) -m int le 2000
    acl agg_v2    var(txn.agg_key),table_gpt(0,req_agg) eq 2
    acl agg_gen   var(txn.agg_key),table_gpt(2,req_agg),sub(txn.agg_gen) eq 0
    acl agg_over  var(txn.agg_key),table_gpt(1,req_agg) ge 100
    acl local_over var(txn.agg_lrate) -m int ge 100
    # Local protection: always active, with the full per-proxy limit,
    # never divided by the number of proxies.
    http-request deny deny_status 429 if local_over
    # Aggregate protection: the same limit on the cluster-wide rate, only
    # while the output is authoritative.
    http-request deny deny_status 429 if agg_meta agg_lease agg_v2 agg_gen agg_over
    default_backend app

backend app
    server app1 127.0.0.1:8090
